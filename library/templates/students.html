{% extends 'base.html' %}
{% block content %}
<h1>Students List</h1>
<table border="1" cellpadding="10">
    <tr>
        <th>Name</th>
        <th>USN</th>
        <th>Email</th>
        <th>Department</th>
    </tr>
    {% for student in students %}
    <tr>
        <td>{{student.student_name}}</td>
        <td>{{student.usn}}</td>
        <td>{{student.email}}</td>
        <td>{{student.department}}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No students available</td>
    </tr>
    {% endfor %}
</table>


{% endblock %}
