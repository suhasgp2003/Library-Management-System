{% if page_obj.paginator.num_pages > 1 %}
<nav class="flex flex-wrap items-center justify-between gap-4 mt-7" aria-label="Pagination">
    <span class="muted text-sm">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} results</span>
    <div class="flex gap-3">{% if page_obj.has_previous %}<a class="button button-secondary" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="button button-secondary" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>{% endif %}</div>
</nav>
{% endif %}
